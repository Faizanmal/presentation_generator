# Render Blueprint — backend + Postgres + Redis (Free tier)
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy: set FRONTEND_URL to your Vercel URL in the dashboard.
# Env templates: backend-nest/.env.example (this service). Frontend: frontend/.env.example (Vercel).
# Free web services sleep after 15 min idle — use GitHub keep-alive workflow.

services:
  - type: web
    name: presentation-designer-api
    runtime: node
    plan: free
    rootDir: backend-nest
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate resolve --applied "20260805180000_apply_pending_sql" || true && npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health/liveness
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.12.0"
      # NODE_ENV=production makes npm skip devDependencies, but the Nest CLI,
      # TypeScript and Prisma CLI all live there and are needed to build/migrate.
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "false"
      # Free Key Value (~50 connections): keep Redis quiet
      - key: REDIS_LOW_LOAD
        value: "true"
      - key: QUEUE_ENABLED
        value: "false"
      - key: RATE_LIMIT_USE_REDIS
        value: "false"
      - key: CLUSTER_REDIS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: presentation-designer-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: presentation-designer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: presentation-designer-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # Optional integrations — disabled so missing credentials cannot break boot
      - key: MAIL_ENABLED
        value: "false"
      - key: RECAPTCHA_ENABLED
        value: "false"
      - key: SENTRY_ENABLED
        value: "false"
      - key: METRICS_ENABLED
        value: "true"
      # Set these in the Render dashboard after the first deploy
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Google OAuth is skipped entirely unless all three are present
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

  - type: keyvalue
    name: presentation-designer-redis
    plan: free
    # BullMQ requires noeviction — under any other policy Redis can drop keys
    # mid-job and queued work disappears silently.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: presentation-designer-db
    plan: free
    databaseName: presentation_designer
    user: presentation_designer
