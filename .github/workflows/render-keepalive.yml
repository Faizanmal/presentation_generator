# Pings Render Free so it does not spin down after 15 minutes of idle.
# Requires repo secret: RENDER_BACKEND_URL (e.g. https://your-api.onrender.com)
#
# Trade-off: keeping the service awake 24/7 uses Render's 750 free instance hours/month.
# If you hit that limit, free services suspend until next month — upgrade to Starter to avoid both.

name: Render Keep-Alive

on:
  schedule:
    # Every 12 minutes — must be under Render's 15-minute idle window
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Render backend
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Missing secret RENDER_BACKEND_URL — skipping."
            exit 0
          fi

          # Prefer liveness (no DB/Redis) so the ping stays cheap
          URL="${BACKEND_URL%/}/health/liveness"
          echo "Pinging $URL"

          # Cold start can take ~60s; retry a few times
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 90 "$URL"; then
              echo ""
              echo "Keep-alive OK (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed — retrying in 15s..."
            sleep 15
          done

          echo "Keep-alive failed after retries"
          exit 1
